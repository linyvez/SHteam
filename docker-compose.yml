services:
  mongo1:
    image: mongo:7.0
    container_name: shteam-mongo1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    networks:
      - shteam-net

  mongo2:
    image: mongo:7.0
    container_name: shteam-mongo2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - mongo2_data:/data/db
    networks:
      - shteam-net

  mongo3:
    image: mongo:7.0
    container_name: shteam-mongo3
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27019"]
    ports:
      - "27019:27019"
    volumes:
      - mongo3_data:/data/db
    networks:
      - shteam-net

  mongo-init:
    image: mongo:7.0
    container_name: shteam-mongo-init
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    command:
      - bash
      - -c
      - |
        until mongosh --host mongo1:27017 --eval "db.adminCommand('ping')" --quiet &>/dev/null; do
          sleep 2
        done

        mongosh --host mongo1:27017 --eval "
        try {
          rs.status();
          console.log('Replica set already initialized.');
        } catch (e) {
          console.log('Initializing Replica Set...');
          rs.initiate({
            _id: 'rs0',
            members: [
              { _id: 0, host: 'mongo1:27017' },
              { _id: 1, host: 'mongo2:27018' },
              { _id: 2, host: 'mongo3:27019' }
            ]
          });
        }
        "
    networks:
      - shteam-net

  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    networks:
      - shteam-net

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...' &&
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done &&
      echo 'Creating bucket...' &&
      mc mb -p local/shader-thumbnails || true &&
      echo 'Setting public download policy...' &&
      mc anonymous set download local/shader-thumbnails &&
      echo 'MinIO Initialization complete!'
      "
    networks:
      - shteam-net

  neo4j:
    image: neo4j:5
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/password123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - shteam-net

  catalog-service:
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    container_name: shteam-catalog
    ports:
      - "3000:3000"
    volumes:
      - ./apps/catalog-service:/app/apps/catalog-service
      - ./packages/shared:/app/packages/shared
    environment:
      - MONGO_URI=mongodb://mongo1:27017,mongo2:27018,mongo3:27019/shteam_catalog?replicaSet=rs0
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_PUBLIC_URL=http://localhost:9000
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - shteam-net

  catalog-init:
    image: node:20-alpine
    container_name: shteam-catalog-init
    working_dir: /app
    volumes:
      - ./apps/catalog-service/src/seed:/app
    depends_on:
      catalog-service:
        condition: service_started
    command: node seed.js
    restart: "no"
    networks:
      - shteam-net

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: shteam-order
    environment:
      - "CASSANDRA_URL=shteam-cassandra:9042"
      - "KAFKA_URL=shteam-kafka:9092"
    ports:
      - "3001:3001"
    volumes:
      - ./apps/order-service:/app/apps/order-service
      - ./packages/shared:/app/packages/shared
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    networks:
      - shteam-net

  kafka:
    container_name: shteam-kafka
    image: apache/kafka:latest
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://shteam-kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - kafka_data:/apache/kafka

    networks:
      - shteam-net

  kafka-init:
    image: apache/kafka:latest
    container_name: shteam-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Waiting for Kafka...' &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic ORDER_INITIATED --partitions 1 --replication-factor 1 --bootstrap-server shteam-kafka:9092 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic FUNDS_RESERVED --partitions 1 --replication-factor 1 --bootstrap-server shteam-kafka:9092 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic INSUFFICIENT_FUNDS --partitions 1 --replication-factor 1 --bootstrap-server shteam-kafka:9092 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic ORDER_REVERT_FUNDS --partitions 1 --replication-factor 1 --bootstrap-server shteam-kafka:9092 &&
      echo 'Topic creation done!'
      "
    networks:
      - shteam-net

  cassandra:
    image: "cassandra:latest"
    container_name: "shteam-cassandra"
    ports:
      - 9042:9042
    environment:
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - CASSANDRA_LISTEN_ADDRESS=auto
      - CASSANDRA_BROADCAST_ADDRESS=cassandra
      - CASSANDRA_CLUSTER_NAME=shteam_cluster
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=shteam_datacenter
      - HEAP_NEWSIZE=500
      - MAX_HEAP_SIZE=2G
    volumes:
      - cassandra-data:/var/lib/cassandra:rw
    restart: on-failure
    networks:
      - shteam-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 10s
      start_period: 30s
      timeout: 5s
      retries: 10

  cassandra-init:
    image: "cassandra:latest"
    container_name: "shteam-cassandra-init"
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./scripts/init-cassandra.cql:/init.cql:ro
    command: cqlsh cassandra -f /init.cql
    networks:
      - shteam-net
  # Identity service
  postgres:
    image: postgres:15-alpine
    container_name: shteam-postgres
    environment:
      POSTGRES_USER: shteam_user
      POSTGRES_PASSWORD: shteam_password
      POSTGRES_DB: identity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shteam-net

  redis:
    image: redis:7-alpine
    container_name: shteam-redis
    ports:
      - "6379:6379"
    networks:
      - shteam-net

  identity-service-1:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    container_name: shteam-identity-1
    depends_on:
      - postgres
      - redis
      - kafka-init
    networks:
      - shteam-net

  identity-service-2:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    container_name: shteam-identity-2
    depends_on:
      - postgres
      - redis
      - kafka-init
    environment:
      - TYPEORM_SYNC=false
    networks:
      - shteam-net

  api-gateway:
    image: nginx:alpine
    container_name: shteam-api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity-service-1
      - identity-service-2
      - catalog-service
      - order-service
      - social-service
    networks:
      - shteam-net

  social-service:
    build:
      context: .
      dockerfile: apps/social-service/Dockerfile
    container_name: shteam-social
    ports:
      - "3004:3001"
    volumes:
      - ./apps/social-service:/app/apps/social-service
      - ./packages/shared:/app/packages/shared
    environment:
      - KAFKA_BROKER=kafka:9092
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    depends_on:
      neo4j:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - shteam-net

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: shteam-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages/shared:/app/packages/shared
    depends_on:
      - catalog-service
    environment:
      - NODE_ENV=development
    networks:
      - shteam-net

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  minio-data:
  cassandra-data:
  neo4j_data:
  kafka_data:
  postgres_data:

networks:
  shteam-net:
    driver: bridge
