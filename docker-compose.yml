  neo4j:
    image: neo4j:5
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/password123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - shteam-net

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://kafka:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - kafka_data:/apache/kafka
    networks:
      - shteam-net

  catalog-service:
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    container_name: shteam-catalog
    ports:
      - "3000:3000"
    volumes:
      - ./apps/catalog-service:/app/apps/catalog-service
      - ./packages/shared:/app/packages/shared
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - shteam-net

  social-service:
    build:
      context: .
      dockerfile: apps/social-service/Dockerfile
    container_name: shteam-social
    ports:
      - "3001:3001"
    volumes:
      - ./apps/social-service:/app/apps/social-service
      - ./packages/shared:/app/packages/shared
    environment:
      - KAFKA_BROKER=kafka:29092
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    depends_on:
      - neo4j
      - kafka
    networks:
      - shteam-net

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: shteam-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages/shared:/app/packages/shared
    depends_on:
      - catalog-service
    environment:
      - NODE_ENV=development
    networks:
      - shteam-net

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  minio-data:
  # postgres_data:
  # cassandra_data:
  neo4j_data:
  kafka_data:


networks:
  shteam-net:
    driver: bridge