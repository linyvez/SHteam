services:
  mongo1:
    image: mongo:7.0
    container_name: shteam-mongo1
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27017" ]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    networks:
      - shteam-net

  mongo2:
    image: mongo:7.0
    container_name: shteam-mongo2
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27018" ]
    ports:
      - "27018:27018"
    volumes:
      - mongo2_data:/data/db
    networks:
      - shteam-net

  mongo3:
    image: mongo:7.0
    container_name: shteam-mongo3
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27019" ]
    ports:
      - "27019:27019"
    volumes:
      - mongo3_data:/data/db
    networks:
      - shteam-net

  mongo-init:
    image: mongo:7.0
    container_name: shteam-mongo-init
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    command:
      - bash
      - -c
      - |
        until mongosh --host mongo1:27017 --eval "db.adminCommand('ping')" --quiet &>/dev/null; do
          sleep 2
        done

        mongosh --host mongo1:27017 --eval "
        try {
          rs.status();
          console.log('Replica set already initialized.');
        } catch (e) {
          console.log('Initializing Replica Set...');
          rs.initiate({
            _id: 'rs0',
            members: [
              { _id: 0, host: 'mongo1:27017' },
              { _id: 1, host: 'mongo2:27018' },
              { _id: 2, host: 'mongo3:27019' }
            ]
          });
        }
        "
    networks:
      - shteam-net

  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    networks:
      - shteam-net

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...' &&
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done &&
      echo 'Creating bucket...' &&
      mc mb -p local/shader-thumbnails || true &&
      echo 'Setting public download policy...' &&
      mc anonymous set download local/shader-thumbnails &&
      echo 'MinIO Initialization complete!'
      "
    networks:
      - shteam-net

  catalog-service:
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    container_name: shteam-catalog
    ports:
      - "3000:3000"
    volumes:
      - ./apps/catalog-service:/app/apps/catalog-service
      - ./packages/shared:/app/packages/shared
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      - shteam-net

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: shteam-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages/shared:/app/packages/shared
    depends_on:
      - catalog-service
    environment:
      - NODE_ENV=development
    networks:
      - shteam-net

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  minio-data:


networks:
  shteam-net:
    driver: bridge